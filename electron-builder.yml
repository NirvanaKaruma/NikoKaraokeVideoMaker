appId: com.niko.karaoke
productName: NikoKaraokeVideoMaker
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{docs,nikokaraoke.md,TEST.md,dev.bat,TEST-ARTIFACTS,vitest.config.ts}'
  - '!{.npm-cache,.electron-cache,.electron-builder-cache,smoke-result.txt,smoke-stage.png}'
asarUnpack:
  - resources/**
win:
  executableName: NikoKaraokeVideoMaker
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
npmRebuild: false
